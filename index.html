<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Stock Visualizer — Glassmorphism Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-bg"></div>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-row">
                <span class="logo-emoji">📈</span>
                <div class="title-col">
                    <h1>Quantum Stock Visualizer</h1>
                    <p class="tagline">Real-time stock ledger plotting interactive shares trends.</p>
                </div>
            </div>
            <div class="badge">business</div>
        </header>

        <main class="workspace-card">
            
            <div style="font-size: 20px; font-weight: bold; margin-bottom: 12px;">AAPL Apple Inc: <span id="st-price" style="color:var(--accent);">$182.40</span></div>
            <div id="stock-chart" style="height: 120px; background:#0c0c14; border-radius:8px; border:1px solid var(--border); display:flex; align-items:flex-end; padding:10px; gap:8px;"></div>
        
        </main>
        
        <footer class="app-footer">
            <p>Created as a premium portfolio piece by <a href="https://github.com/VARSHAN69" target="_blank">@VARSHAN69</a></p>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
